/* =========================================================
   📥 제출함 — 호스트가 과제를 내고, 게스트가 글·파일로 제출
   제출물(sub/)은 낸 사람과 호스트만 볼 수 있어요
   ========================================================= */
const KIND={text:{e:'📝',n:'글'},file:{e:'📎',n:'파일'},both:{e:'🗂️',n:'글 + 파일'},image:{e:'🖼️',n:'이미지'},imgtext:{e:'🎨',n:'이미지 + 글'}};
const kText=k=>k==='text'||k==='both'||k==='imgtext',kFile=k=>k==='file'||k==='both',kImg=k=>k==='image'||k==='imgtext';
const MAX_UP=LOCAL?1.5*1024*1024:10*1024*1024;
function tasks(arch=false){return list('task',t=>!!t.archived===arch).sort((a,b)=>(b.at||0)-(a.at||0))}
function subsOf(tid){return list('sub',s=>s.task===tid)}
function mySub(tid){return ME?Store.peek('sub/'+tid+'-'+ME.by):null}
function taskClosed(t){return !!t.closed}
function taskLate(t,at){return !!(t.due&&at>t.due)}
function hwTodo(){if(ROLE.host||!ME)return 0;return tasks().filter(t=>!taskClosed(t)&&!mySub(t.id)).length}
function artTray(){
  return `<div class="sh-art"><div class="tray3d" aria-hidden="true"><div class="tray-back"></div><i class="paper p1"></i><i class="paper p2"></i><i class="paper p3"></i><div class="tray-front">📥 제출함</div></div>
    <span class="flo" style="left:4%;top:10%">📎</span><span class="flo" style="right:6%;top:2%;animation-delay:-1.3s">✏️</span><span class="hw-stamp">제출<br>완료</span></div>`;
}
function vHw(){
  if(ROLE.host&&CUR.task&&Store.peek('task/'+CUR.task))return vTaskDetail(CUR.task);
  CUR.task=null;
  const ts=tasks();const people=talkPeople().length;
  const done=ROLE.host?list('sub').length:ts.filter(t=>mySub(t.id)).length;
  return `
  <section class="shero">${artTray()}
    <div class="sh-t"><span class="sh-k">SUBMISSION BOX</span><h1>제출함</h1>
      <p>호스트가 낸 과제를 <b>글</b>이나 <b>파일</b> 및 <b>이미지</b>로 제출해요.<br>제출물은 <b>나와 호스트만</b> 볼 수 있고, 마감 전까지 몇 번이든 다시 낼 수 있어요.</p>
      <div class="sh-stats"><span><b>${ts.length}</b>개 과제</span>${ROLE.host?`<span><b>${done}</b>건 제출</span><span><b>${people}</b>명 참여자</span>`:`<span><b>${done}</b>개 제출 완료</span><span><b>${hwTodo()}</b>개 남음</span>`}</div>
      ${ROLE.host?'<div class="sh-act"><button class="btn lemon big" data-a="hw-new">＋ 과제 만들기</button></div>':''}</div>
  </section>
  <div class="filters"><h2 style="font-size:24px">📋 과제 목록</h2></div>
  <div class="tgrid">${ts.map(taskCard).join('')||empty('📥','아직 과제가 없어요',ROLE.host?'"과제 만들기"로 첫 과제를 내 보세요.':'호스트가 과제를 내면 여기에 나타나요.')}</div>
  ${ROLE.host?`<details class="archbox" ${CUR.hwArch?'open':''}><summary data-a="hwarch-t">📦 보관한 과제 <b>${tasks(true).length}</b> <small class="muted">게스트에게 보이지 않아요</small></summary><div class="tgrid" style="margin-top:14px">${tasks(true).map(taskCard).join('')||'<p class="muted">보관한 과제가 없어요.</p>'}</div></details>`:''}`;
}
function taskCard(t){
  const k=KIND[t.kind]||KIND.text;const cl=taskClosed(t);
  const due=t.due?`⏰ ${fmtDate(t.due)} 마감${Date.now()>t.due&&!cl?' <span class="late">마감 지남</span>':''}`:'마감 없음';
  let body;
  if(ROLE.host){
    const n=subsOf(t.id).length,m=talkPeople().length;
    body=`<div class="tug-l"><span>제출 <b>${n}</b> / ${m}명</span><span>${m?Math.round(n/m*100):0}%</span></div><div class="prog"><i style="width:${m?Math.min(100,n/m*100):0}%"></i></div>
      <button class="btn lemon wide" data-a="hw-open" data-id="${t.id}">📋 제출 현황 보기</button>`;
  }else{
    const s=mySub(t.id);
    body=`<div class="mysub${s?' ok':''}">${s?`✅ ${fmtDate(s.at)} 제출 완료${taskLate(t,s.at)?' <span class="late">늦은 제출</span>':''}${s.file?`<br><small>📎 ${esc(s.file.name)}</small>`:''}`:'⏳ 아직 제출하지 않았어요'}</div>
      <button class="btn ${s?'':'lemon'} wide" data-a="hw-sub" data-id="${t.id}" ${cl?'disabled':''}>${cl?'🔒 마감됐어요':s?'✏️ 다시 제출하기':'📮 제출하기'}</button>`;
  }
  return `<article class="task${cl?' closed':''}">
    <div class="task-top"><span class="task-ic">${k.e}</span><div style="min-width:0"><h3>${esc(t.title)}</h3><small class="muted">${k.n} 제출 · ${due}${cl?' · 🔒 마감됨':''}</small></div></div>
    ${t.desc?`<p class="task-desc">${esc(t.desc)}</p>`:''}${body}</article>`;
}

  const tid=el.dataset.id;const t=Store.peek('task/'+tid);if(!t)return;
  const k=t.kind||'text';const s=mySub(tid);CUR.hwFile=null;
  if(s&&s.img)CUR.imgs.hw=s.img;else delete CUR.imgs.hw;
  openModal({cls:'th-hw',html:`<div class="modal-hd"><h2>📮 ${esc(t.title)}</h2><button class="xbtn" data-close aria-label="닫기">✕</button></div>
    ${t.desc?`<p class="task-desc" style="margin-bottom:14px">${esc(t.desc)}</p>`:''}
    <div class="stack">
      ${kImg(k)?`<div class="fld">이미지 *${imgPick('hw',s&&s.img?'📷 다른 이미지로 바꾸기':'📷 이미지 고르기')}</div>`:''}
      ${kText(k)?`<label class="fld">내 글 ${k!=='both'?'*':''}<textarea class="in" id="hw-text" rows="7" maxlength="5000" data-count="hw-tc" placeholder="여기에 써서 제출해요">${esc(s&&s.text||'')}</textarea><span class="cnt" id="hw-tc" style="justify-self:end">0/5000</span></label>`:''}
      ${kFile(k)?`<label class="upl"><input type="file" id="hw-file" hidden><div class="upl-in hw-up" id="hw-prev">${s&&s.file?`<span class="upl-e">📎</span><b>${esc(s.file.name)}</b><small>이미 낸 파일이 있어요 · 바꾸려면 눌러요</small>`:`<span class="upl-e">📎</span><b>파일 고르기 ${k==='file'?'*':''}</b><small>사진·한글·PDF·PPT 등 · 최대 ${fmtSize(MAX_UP)}</small>`}</div></label>`:''}
      <p class="muted" style="margin:0;font-size:13px">🔒 제출물은 나와 호스트만 볼 수 있어요.${t.due?` 마감: ${fmtDate(t.due)}`:''}</p>
      <button class="btn lemon big wide" data-a="hw-send" data-id="${tid}">📮 ${s?'다시 제출하기':'제출하기'}</button>
    </div>`});
  const ta=$('#hw-text');if(ta)updCount(ta);
};
document.addEventListener('change',e=>{
  if(e.target.id!=='hw-file')return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const prev=$('#hw-prev');
  if(f.size>MAX_UP){CUR.hwFile=null;prev.innerHTML=`<span class="upl-e">⚠️</span><b>파일이 너무 커요 (${fmtSize(f.size)})</b><small>최대 ${fmtSize(MAX_UP)}까지 올릴 수 있어요</small>`;return}
  CUR.hwFile=f;prev.innerHTML=`<span class="upl-e">✅</span><b>${esc(f.name)}</b><small>${fmtSize(f.size)} · 다른 파일로 바꾸려면 눌러요</small>`;
});
ACT['hw-send']=async el=>{
  if(hostOnly())return;
  const tid=el.dataset.id;const t=Store.peek('task/'+tid);if(!t){toast('지워진 과제예요.');closeModal();return}
  if(taskClosed(t)){toast('마감된 과제예요.');return}
  const k=t.kind||'text';const s=mySub(tid);
  const text=$('#hw-text')?T($('#hw-text').value):'';
  const img=kImg(k)?(CUR.imgs.hw||''):'';
  if((k==='text'||k==='imgtext')&&!text){toast('글을 써 주세요.');return}
  if(kImg(k)&&!img){toast('이미지를 골라 주세요.');return}
  if(k==='file'&&!CUR.hwFile&&!(s&&s.file)){toast('파일을 골라 주세요.');return}
  if(k==='both'&&!text&&!CUR.hwFile&&!(s&&s.file)){toast('글이나 파일 중 하나는 꼭 내 주세요.');return}
  el.disabled=true;
  let file=s&&s.file||null;
  try{
    if(CUR.hwFile){
      el.textContent='파일 올리는 중… 📤';
      const f=CUR.hwFile;const dataUrl=await readDataUrl(f);
      const clean=v=>String(v||'').replace(/[\\/:*?"<>|#%]+/g,' ').trim();
      const r=await Store.upload({cid:CUR.cid,task:tid,name:`${clean(t.title)}_${clean(ME.name)}_${clean(f.name)}`,mime:f.type||'application/octet-stream',dataUrl});
      file={name:f.name,size:f.size,mime:f.type||'',url:r.url};
    }
    el.textContent='제출하는 중…';
    await Store.set('sub/'+tid+'-'+ME.by,{cid:CUR.cid,task:tid,text,file,img,...stamp(),at:Date.now(),n:((s&&s.n)||0)+1});
  }catch(e){dbErr(e);el.disabled=false;el.textContent='📮 다시 시도하기';return}
  CUR.hwFile=null;takeImg('hw');closeModal();pop('제출 완료!');confetti(['#FFD84D','#F5B700','#23BF98','#4DA3FF']);rerender();
};

    ${t.desc?`<p class="task-desc">${esc(t.desc)}</p>`:''}

    ${rows.map(p=>{const s=subs[p.by];return `<tr><td><b>${esc(p._name||'')}</b></td><td><span class="who">${avatar(p.char,'sm')}${esc(p.nick)}</span></td>

      <td class="muted">${s?fmtDate(s.at)+(taskLate(t,s.at)?' <span class="late">늦음</span>':'')+(s.n>1?` <small>(${s.n}번째)</small>`:''):''}</td>
      <td>${s&&s.text?`<button class="btn sm" data-a="hw-read" data-k="${esc(tid+'-'+p.by)}">📝 ${esc(s.text.slice(0,14))}${s.text.length>14?'…':''}</button>`:''}</td>
      <td>${s&&s.img?imgHTML(s.img,{cls:'hw-thumb'}):''}</td>

    ${logo()}
    <p class="tagline">매체 속 한 장면으로 서로의 마음을 치유해요</p></div>`;
}
function vJoin(){
  const keep=id=>{const el=$('#'+id);return el?el.value:null};
  const all=classesSorted();
  if(G.cid&&!Store.peek('classes/'+G.cid)&&!G.lockCls)G.cid=null;
  if(!G.cid&&all.length===1)G.cid=all[0].id;
  if(!G.cid){const last=LS.get('rx-g-last','');if(last&&Store.peek('classes/'+last))G.cid=last}
  const c=gCls(G.cid);
  const name=keep('g-name')??'';
  let body;
  if(!c&&!Store.loaded())body=`<div class="card waitcard"><span class="wait-emo">📡</span><b>모임을 불러오는 중…</b><p class="muted">인터넷 연결을 확인해 주세요. 연결되면 자동으로 나타나요.</p></div>`;
  else if(!c&&G.lockCls)body=`<div class="card waitcard"><span class="wait-emo">🔍</span><b>모임을 찾지 못했어요</b><p class="muted">주소가 맞는지 호스트에게 확인해 주세요.</p></div>`;
  else if(!all.length)body=`<div class="card waitcard"><span class="wait-emo">⏳</span><b>아직 열린 모임이 없어요</b><p class="muted">호스트가 모임을 만들면 자동으로 나타나요.</p></div>`;
  else body=`<div class="card join-card">
    ${!G.lockCls&&all.length>1?`<label class="fld">우리 모임<select class="in" id="g-cls"><option value="">선택하세요</option>${all.map(x=>`<option value="${x.id}" ${x.id===G.cid?'selected':''}>${esc((x.emo||'')+' '+x.name)}</option>`).join('')}</select></label>`:''}
    ${c?`<div class="jcls" style="--c:${c.color||'#23BF98'}"><span class="jcls-e">${esc(c.emo||'📚')}</span><div><small>오늘의 모임</small><b>${esc(c.name)}</b></div></div>`:''}
    <label class="fld">이름(학번)<span class="name-wrap"><span class="name-ic">🪪</span><input class="in name-in" id="g-name" maxlength="30" autocomplete="off" placeholder="예: 김오독(10203)" value="${esc(name)}"></span>
      <small class="muted">🔒 호스트만 볼 수 있어요. 다른 사람에게는 아래 닉네임만 보여요.</small></label>
    <div class="char-stage tilt">${avatar(G.char,'xl')}<div class="char-name"><small>나의 닉네임</small><b id="g-nick"><em>${esc(G.adj)}</em> ${esc(charOf(G.char)[1])}</b><button class="btn sm lemon" data-a="g-dice">🎲 아무거나 골라 줘</button></div></div>
    <div class="pickbox"><div class="char-hd"><span class="stepn">1</span>동물 고르기 <small class="muted">${esc(charOf(G.char)[0]+' '+charOf(G.char)[1])}</small></div>
      <div class="chars">${CHARS.map((ch,i)=>`<button class="charb${G.char===i?' on':''}" data-a="g-char" data-i="${i}" aria-label="${esc(ch[1])}" aria-pressed="${G.char===i}" title="${esc(ch[1])}">${avatar(i)}<small>${esc(ch[1])}</small></button>`).join('')}</div></div>
    <div class="pickbox"><div class="char-hd"><span class="stepn">2</span>꾸며 주는 말 고르기 <small class="muted">${esc(G.adj)}</small></div>
      <div class="adjs">${ADJ.map(a=>`<button class="adjb${G.adj===a?' on':''}" data-a="g-adj" data-v="${esc(a)}" aria-pressed="${G.adj===a}">${esc(a)}</button>`).join('')}</div></div>
    <button class="btn coral big wide joinbtn" data-a="g-join">입장하기 ▶</button>
    <p class="hint">같은 이름(학번)으로 다시 들어오면 내 글과 대화방이 그대로 이어져요.</p>
  </div>`;
  app.innerHTML=`${DECO}<div class="jwrap">${hero()}${body}
    <div class="jmenus">${TABS.map((t,i)=>`<div class="jm tilt" style="--c:${t.c};--i:${i}"><span class="mt-ic">${t.e}</span><b>${t.n}</b><small>${{talk:'우리끼리 단체 대화',rx:'익명 고민에 책 구절 처방',vend:'제목을 가린 한 문장 뽑기',copy:'손글씨 필사 릴레이',court:'변호인 vs 검사 공방',hw:'과제를 글·파일로 제출'}[t.k]}</small></div>`).join('')}</div>
    ${LOCAL?'<p class="muted" style="font-size:13px;text-align:center">체험 모드: 이 브라우저에만 저장돼요.</p>':''}</div>`;
  document.body.className='th-rx';
}
/* 고를 때마다 입장 카드만 다시 그리되, 고르는 목록의 스크롤 위치는 그대로 */
function rejoin(){const a=$('.chars'),b=$('.adjs');const sa=a?a.scrollTop:0,sb=b?b.scrollTop:0;vJoin();const a2=$('.chars'),b2=$('.adjs');if(a2)a2.scrollTop=sa;if(b2)b2.scrollTop=sb;savePick()}
ACT['g-char']=el=>{G.char=+el.dataset.i;rejoin()};
ACT['g-adj']=el=>{G.adj=el.dataset.v;rejoin()};
ACT['g-dice']=()=>{G.char=Math.floor(Math.random()*CHARS.length);G.adj=pick(ADJ);rejoin();const n=$('#g-nick');if(n)n.classList.add('shake')};
document.addEventListener('change',e=>{if(e.target.id==='g-cls'){G.cid=e.target.value||null;vJoin()}});
ACT['g-join']=async el=>{
  const c=gCls(G.cid);const name=normName($('#g-name').value);
  if(!c){toast('우리 모임을 골라 주세요.');return}
  if(!name){toast('이름(학번)을 입력해 주세요.');$('#g-name').focus();return}
  el.disabled=true;el.textContent='입장하는 중…';
  try{
    const r=await Store.join({cid:c.id,name,nick:gNick(),char:G.char});
    ME={cid:c.id,tok:r.tok,by:r.by,nick:r.nick,char:r.char,name};
    saveSess();CUR.cid=c.id;
    await Store.setTok(ME.tok);
    buildIX();app.innerHTML='';gRender();
    if(r.back)toast(`다시 오셨군요, ${r.nick}님! 🌿`);else{pop('어서 와요!');toast(`${r.nick}${josa(r.nick,'으로','로')} 입장했어요`)}
  }catch(e){dbErr(e);el.disabled=false;el.textContent='입장하기 ▶'}
};

/* ---------- 메인 화면 ---------- */
function enabledTabs(c){return TABS.filter(t=>menuOn(c,t.k))}
function gRender(){
  if(!ME)return vJoin();
  const c=gCls(ME.cid);
  if(!c){if(Store.loaded())logout(true);return}
  const tabs=enabledTabs(c);
  if(tabs.length&&!tabs.some(t=>t.k===CUR.tab))CUR.tab=tabs[0].k;
  document.body.className='th-'+CUR.tab;
  if(!$('#main')){
    app.innerHTML=`<header class="topbar"><div class="tb-in"><div class="tb-row" id="tbrow"></div><nav class="mtabs" id="mtabs" aria-label="메뉴"></nav></div></header><main class="main" id="main"></main>`;
  }
  const un=unreadAll();
  $('#tbrow').innerHTML=`${logo(true)}<span class="clschip">${esc(c.emo||'📚')} ${esc(c.name)}</span><span class="grow"></span>
    <span id="netdot" class="tag" style="background:var(--coral);color:#fff" hidden>연결 끊김</span>
    <button class="btn sm inbox" data-a="rooms" title="내 대화방" aria-label="내 대화방">💬${un?`<b class="nb">${un}</b>`:''}</button>
    <button class="mechip" data-a="g-me">${avatar(ME.char,'sm')}<b>${esc(ME.nick)}</b></button>`;
  const nav=$('#mtabs');nav.style.setProperty('--n',tabs.length||1);
  const badge={talk:CUR.tab==='talk'?0:talkUnread(),hw:hwTodo()};
  nav.innerHTML=tabs.map(t=>`<button class="mtab${CUR.tab===t.k?' on':''}" style="--c:${t.c};--d:${t.d}" data-a="tab" data-v="${t.k}" aria-current="${CUR.tab===t.k?'page':'false'}"><span class="mt-ic">${t.e}</span><span class="mt-t">${t.lg?`<span class="lg">${t.lg}</span>`:''}${t.s}</span>${badge[t.k]?`<b class="bt-n">${badge[t.k]>99?'99+':badge[t.k]}</b>`:''}</button>`).join('');
  const main=$('#main');
  /* 단체 대화는 새 메시지만 끼워 넣기 (쓰는 중이어도 바로 보임) */
  if(CUR.tab==='talk'&&main.dataset.v==='talk'&&$('#talk-list')){patchTalk();return}
  if(typingIn(main)){G.pending=true;return}
  G.pending=false;
  main.className='main th-'+CUR.tab;main.dataset.v=CUR.tab;
  paint(main,tabs.length?VIEWS[CUR.tab]():empty('🌙','지금은 열린 메뉴가 없어요','호스트가 메뉴를 열면 자동으로 나타나요.'));
  if(CUR.tab==='talk')afterTalk();
}
rerender=gRender;
let pendT;
document.addEventListener('focusout',()=>{clearTimeout(pendT);pendT=setTimeout(()=>{if(G.pending&&!typingIn($('#main')))gRender()},1200)});
ACT.tab=el=>{CUR.tab=el.dataset.v;CUR.trial=null;CUR.re=null;LS.set('rx-g-tab',CUR.tab);gRender();window.scrollTo({top:0})};
ACT['g-me']=()=>{
  openModal({narrow:true,html:`<div class="modal-hd"><h2>나의 정보</h2><button class="xbtn" data-close aria-label="닫기">✕</button></div>
    <div class="char-stage">${avatar(ME.char,'xl')}<div class="char-name"><small>닉네임</small><b>${esc(ME.nick)}</b><small class="muted">🪪 ${esc(ME.name)} (호스트만 볼 수 있어요)</small></div></div>
    <p class="muted">다른 기기에서도 같은 이름(학번)으로 들어오면 이어서 쓸 수 있어요.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>닫기</button><button class="btn coral" data-a="g-out">🚪 나가기</button></div>`});
};
ACT['g-out']=()=>{closeModal();logout(false)};
function logout(silent){
  if(ME){const s=sessions();delete s[ME.cid];LS.set('rx-g-sess',s)}
  G.cid=ME?ME.cid:G.cid;ME=null;CUR.cid=null;Store.setTok('');app.innerHTML='';vJoin();
  if(silent)toast('모임이 닫혔거나 기록을 찾지 못했어요. 다시 입장해 주세요.');
}

/* ---------- 시작 ---------- */
async function startGuest(){
  const h=(location.hash||'').slice(1);
  if(h.startsWith('c-')){G.cid=h.slice(2);G.lockCls=true}
  CUR.tab=LS.get('rx-g-tab','talk');
  const all=sessions();const cid=G.cid||LS.get('rx-g-last','');const s=cid&&all[cid];
  app.innerHTML=`${DECO}<div class="jwrap">${hero()}<div class="card waitcard"><span class="wait-emo">💊</span><b>불러오는 중…</b></div></div>`;
  await Store.init({poll:3500,token:s?s.tok:''});
  if(s&&(!Store.loaded()||(Store.peek('classes/'+s.cid)&&Store.peek('people/'+s.cid+'-'+s.by)))){ME=s;CUR.cid=s.cid}
  else if(s){delete all[cid];LS.set('rx-g-sess',all);Store.setTok('')}
  buildIX();gRender();
  Store.on(()=>{
    buildIX();
    if(!ME){const a=document.activeElement;if(!(a&&/INPUT|SELECT/.test(a.tagName)))vJoin();return}
    gRender();refreshModal();
  });
}
startGuest();

</script>
</body>
